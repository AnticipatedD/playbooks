name: Check Website & Python Tooling

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies & Audit
        run: |
          cd website
          npm ci
          npm audit --audit-level=high || true

      - name: Run Website Tests & Typecheck
        run: |
          cd website
          npx tsc --noEmit || true
          npx vitest run || true
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Script Tests
        run: |
          pip install -r .github/scripts/requirements.txt
          python -m unittest discover .github/scripts -p 'test_*.py'
