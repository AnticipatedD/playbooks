version: 2
updates:
  # Weekly automated tracking for the frontend Next.js ecosystem
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Weekly automated tracking for the Python infrastructure scripting tooling
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
